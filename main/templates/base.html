<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Coffee Cafe</title>

    {% load static %}
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>

<!-- NAVBAR -->
<header class="navbar">
    <div class="logo">☕ Brew Haven</div>

    <nav>
        <a href="/">Home</a>
        <a href="/menu/">Menu</a>
        <a href="/gallery/">Gallery</a>
        <a href="/cart/">Cart</a>
        <a href="/reserve/">Reserve</a>

        {% if user.is_authenticated %}
            <a href="/orders/">My Orders</a>
            <a href="/checkout/">Checkout</a>
            <span style="color:#F5EFE6; margin-left:10px;">
                Hi, {{ user.username }}
            </span>
            <a href="/logout/">Logout</a>
        {% else %}
            <a href="/login/">Login</a>
            <a href="/signup/">Signup</a>
        {% endif %}
    </nav>
</header>

<!-- PAGE CONTENT -->
<div class="content">
    {% block content %}
    {% endblock %}
</div>

<!-- FOOTER -->
<footer class="footer">
    <p>© 2026 Brew Haven Café | Fresh Coffee Everyday</p>
</footer>

</body>
</html>
