{% extends 'base.html' %}
{% block content %}

<h1>Reserve a Table 🪑</h1>

{% if success %}
<p style="color:green;">✔ Reservation Successful</p>
{% endif %}

<form method="POST">
{% csrf_token %}
<input name="name" placeholder="Name" required><br>
<input name="phone" placeholder="Phone" required><br>
<input type="date" name="date" required><br>
<input type="time" name="time" required><br>
<input name="guests" placeholder="Guests" required><br><br>
<button class="btn">Reserve</button>
</form>

{% endblock %}
